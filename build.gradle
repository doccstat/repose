plugins { id 'com.android.application' version '8.11.1' }

layout.buildDirectory = file(providers.gradleProperty('reposeBuildDir').getOrElse("${System.getProperty('user.home')}/.cache/repose/gradle"))
def appManifest = new groovy.xml.XmlSlurper(false, false).parse(file('AndroidManifest.xml'))
def observerClasses = layout.buildDirectory.dir('observer-classes')
def observerAssets = layout.buildDirectory.dir('observer-assets')
def api = System.getenv('XPOSED_API_JAR')
if (!api || !file(api).isFile()) throw new GradleException('Set XPOSED_API_JAR to API 82')
if (java.security.MessageDigest.getInstance('SHA-256').digest(file(api).bytes).encodeHex().toString()
        != 'f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25') throw new GradleException('Unexpected Xposed API checksum')
android {
    namespace 'com.lixingchi.repose'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.lixingchi.repose'
        minSdk 33
        targetSdk 36
        versionCode appManifest.'@android:versionCode'.text().toInteger()
        versionName appManifest.'@android:versionName'.text()
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets', observerAssets]
        }
        test.java.srcDirs = ['tests', 'observer']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { generateLocaleConfig = true; localeFilters += ['en'] }
    buildTypes { debug { pseudoLocalesEnabled true }; release { minifyEnabled false } }
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all { systemProperty 'repose.source', projectDir.absolutePath }
    lint { fatal 'MissingTranslation', 'ExtraTranslation', 'StringFormatInvalid', 'StringFormatMatches', 'MissingQuantity' }
}
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant -> variant.androidResources.localeFilters.addAll('en-rXA', 'ar-rXB') }
}
tasks.register('compileKeyguardObserver', JavaCompile) {
    source = fileTree('observer') { include '**/*.java' }
    classpath = files()
    options.release = 17
    destinationDirectory = observerClasses
}
tasks.register('dexKeyguardObserver', JavaExec) {
    dependsOn 'compileKeyguardObserver'
    def adapter = observerClasses.map { it.file('com/lixingchi/repose/observer/KeyguardObserver.class') }
    def output = observerAssets.map { it.dir('keyguard-observer') }
    inputs.files(adapter, observerClasses)
    outputs.dir(output)
    classpath = files("${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/lib/d8.jar")
    mainClass = 'com.android.tools.r8.D8'
    doFirst {
        output.get().asFile.mkdirs()
        args = ['--min-api', '33', '--lib', android.bootClasspath[0].absolutePath,
                '--classpath', observerClasses.get().asFile.absolutePath,
                '--output', output.get().asFile.absolutePath, adapter.get().asFile.absolutePath]
    }
}
tasks.named('preBuild').configure { dependsOn 'dexKeyguardObserver' }
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    compileOnly files(api)
    testImplementation files(api)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.17'
}
