plugins { id 'com.android.application' version '8.11.1' }

layout.buildDirectory = file(providers.gradleProperty('reposeBuildDir').getOrElse("${System.getProperty('user.home')}/.cache/repose/gradle"))
def api = System.getenv('XPOSED_API_JAR')
if (!api || !file(api).isFile()) throw new GradleException('Set XPOSED_API_JAR to API 82')
if (java.security.MessageDigest.getInstance('SHA-256').digest(file(api).bytes).encodeHex().toString()
        != 'f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25') throw new GradleException('Unexpected Xposed API checksum')
android {
    namespace 'com.lixingchi.repose'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.lixingchi.repose'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test.java.srcDirs = ['tests']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { generateLocaleConfig = true; localeFilters += ['en'] }
    buildTypes { debug { pseudoLocalesEnabled true }; release { minifyEnabled false } }
    testOptions.unitTests.includeAndroidResources = true
    testOptions.unitTests.all { systemProperty 'repose.source', projectDir.absolutePath }
    lint { fatal 'MissingTranslation', 'ExtraTranslation', 'StringFormatInvalid', 'StringFormatMatches', 'MissingQuantity' }
}
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant -> variant.androidResources.localeFilters.addAll('en-rXA', 'ar-rXB') }
}
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    compileOnly files(api)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.17'
}
