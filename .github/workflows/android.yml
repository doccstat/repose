name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK and NDK components
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >>"$GITHUB_ENV"
          echo "XPOSED_API_JAR=$RUNNER_TEMP/api-82.jar" >>"$GITHUB_ENV"
      - name: Fetch pinned Xposed API 82 jar
        run: |
          curl -fsSLo "$XPOSED_API_JAR" https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar
          echo 'f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25  '"$XPOSED_API_JAR" | sha256sum -c -
      - name: Test, lint and build the unsigned pair
        run: |
          export GRADLE_USER_HOME="$HOME/.gradle"
          python3 -B build.py --test --out dist
          python3 -B build.py --lint --out dist
          python3 -B build.py --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-build
          path: |
            dist/Repose-unsigned.apk
            dist/Repose-unsigned.apk.sha256
            dist/Repose-module.zip
            dist/Repose-module.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-reports
          path: |
            dist/gradle/reports/
            dist/gradle/test-results/
          retention-days: 7
