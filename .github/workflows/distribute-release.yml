name: Distribute latest release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize with signing so same-version assets cannot change during verification.
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  distribute:
    if: >-
      github.repository == 'doccstat/repose' &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Verify and mirror the latest stable APK and module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LSPOSED_RELEASE_TOKEN: ${{ secrets.LSPOSED_RELEASE_TOKEN }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash tools/distribute.sh
